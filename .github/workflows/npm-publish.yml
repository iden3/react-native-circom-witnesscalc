name: Publish package to NPM

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.10
          registry-url: https://registry.npmjs.org/
      - run: yarn install --immutable
      - run: |
          echo "//registry.npmjs.org/:_authToken=${{secrets.IDENTITY_NPM_PUBLISH_TOKEN}}" > .npmrc
          yarn npm publish
        env:
          NPM_TOKEN: ${{secrets.IDENTITY_NPM_PUBLISH_TOKEN}}
